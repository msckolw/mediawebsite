name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: project-d19d2737-e186-40d9-879
  SERVICE_NAME: thenbm
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --format='value(status.url)')
          echo "⏳ Checking backend health at ${SERVICE_URL}/api/health..."
          for attempt in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/api/health" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt ${attempt}/12 returned HTTP ${HTTP_CODE:-no response}"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "⚠️ Backend health check did not succeed after 12 attempts"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "📊 Deployment Summary"
          echo "═══════════════════════════════════════"
          echo "Platform: Google Cloud Run"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Commit: ${{ github.sha }}"
          echo "Backend URL: $(gcloud run services describe '${{ env.SERVICE_NAME }}' --region '${{ env.REGION }}' --platform managed --format='value(status.url)' 2>/dev/null || echo 'unavailable')"
          echo "═══════════════════════════════════════"
