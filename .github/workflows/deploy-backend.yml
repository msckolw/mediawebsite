name: Validate application

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.node-version'
      - 'package.json'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.node-version'
      - 'package.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Validate backend JavaScript syntax
        run: find backend -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run backend regression tests
        run: npm test --prefix backend

      - name: Build Docker image
        run: docker build --tag mediawebsite-validation .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build for production
        run: npm run build
        env:
          CI: true
