name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: project-d19d2737-e186-40d9-879
  SERVICE_NAME: thenbm
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} ./backend

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for deployment to be ready..."
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://thenbm-329287861933.asia-south1.run.app/api/news?page=1")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend is live and responding (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Backend returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "📊 Deployment Summary"
          echo "═══════════════════════════════════════"
          echo "Platform: Google Cloud Run"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Commit: ${{ github.sha }}"
          echo "Backend URL: https://thenbm-329287861933.asia-south1.run.app"
          echo "═══════════════════════════════════════"
